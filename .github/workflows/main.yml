name: Build AAB
on: 
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Create Keystore
        run: |
          keytool -genkey -v -keystore my-upload-key.jks -keyalg RSA -keysize 2048 -validity 10000 -storepass android -alias upload -keypass android -dname "CN=ChandioX"
          mkdir -p app
          cp my-upload-key.jks app/my-upload-key.jks || true
          mkdir -p android/app
          cp my-upload-key.jks android/app/my-upload-key.jks || true

      - name: Build AAB
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew bundleRelease -x lint --no-daemon
          elif [ -f "./android/gradlew" ]; then
            chmod +x ./android/gradlew
            cd android && ./gradlew bundleRelease -x lint --no-daemon
          else
            gradle bundleRelease -x lint --no-daemon
          fi

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: ChandioX-AAB
          path: |
            app/build/outputs/bundle/release/*.aab
            android/app/build/outputs/bundle/release/*.aab
            **/build/outputs/bundle/release/*.aab

name: Build AAB
on: 
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Create Keystore
        run: |
          keytool -genkey -v -keystore my-upload-key.jks -keyalg RSA -keysize 2048 -validity 10000 -storepass android -alias upload -keypass android -dname "CN=ChandioX, OU=App, O=ChandioX, L=City, S=State, C=PK"
          mkdir -p app
          cp my-upload-key.jks app/my-upload-key.jks
          echo "MYAPP_UPLOAD_STORE_FILE=my-upload-key.jks" >> app/keystore.properties
          echo "MYAPP_UPLOAD_KEY_ALIAS=upload" >> app/keystore.properties
          echo "MYAPP_UPLOAD_STORE_PASSWORD=android" >> app/keystore.properties
          echo "MYAPP_UPLOAD_KEY_PASSWORD=android" >> app/keystore.properties

      - name: Build AAB
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease -x lint --no-daemon

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: ChandioX-AAB-Final
          path: app/build/outputs/bundle/release/*.aab

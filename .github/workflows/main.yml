nname: Android Build Workflow

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.3.1' # Version change kiya hai plugin compatibility ke liye

      - name: Build Android App (AAB)
        run: |
          gradle bundleRelease -x lint --no-daemon
          
          
          
          

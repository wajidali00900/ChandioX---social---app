name: Build AAB
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle Wrapper
        run: |
          chmod +x gradlew || true
          chmod +x ./android/gradlew || true

      - name: Create Keystore
        run: |
          keytool -genkey -v -keystore my-upload-key.jks -keyalg RSA -keysize 2048 -validity 10000 -storepass android -alias upload -keypass android -dname "CN=ChandioX"
          mkdir -p app
          cp my-upload-key.jks app/my-upload-key.jks || true
          mkdir -p android/app
          cp my-upload-key.jks android/app/my-upload-key.jks || true

      - name: Build AAB with Wrapper
        uses: gradle/gradle-build-action@v3
        with:
          arguments: bundleRelease -x lint --no-daemon --no-configuration-cache
          gradle-version: wrapper

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: ChandioX-AAB
          path: |
            **/build/outputs/bundle/release/*.aab

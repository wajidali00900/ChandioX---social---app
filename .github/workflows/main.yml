name: Build AAB
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1

      - name: Fix Wrapper to 9.3.1
        run: |
          gradle wrapper --gradle-version 9.3.1
          chmod +x gradlew || true
          chmod +x android/gradlew || true
          # Fix wrapper properties to 9.3.1
          sed -i 's/gradle-.*-bin.zip/gradle-9.3.1-bin.zip/' gradle/wrapper/gradle-wrapper.properties || true
          sed -i 's/gradle-.*-bin.zip/gradle-9.3.1-bin.zip/' android/gradle/wrapper/gradle-wrapper.properties || true

      - name: Build AAB
        run: |
          if [ -f "android/gradlew" ]; then
            cd android && ./gradlew bundleRelease -x lint --no-daemon
          else
            ./gradlew bundleRelease -x lint --no-daemon
          fi

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: ChandioX-AAB-FINAL
          path: "**/build/outputs/bundle/release/*.aab"

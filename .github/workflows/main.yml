name: Build AAB

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
          generate-job-summary: true

      - name: Create Keystore and Fix Files
        run: |
          # 1. Generate upload key if it does not exist
          if [ ! -f "my-upload-key.jks" ]; then
            echo "Creating my-upload-key.jks..."
            keytool -genkey -v -keystore my-upload-key.jks -keyalg RSA -keysize 2048 -validity 10000 -alias my-key-alias -storepass my-store-password -keypass my-key-password -dname "CN=Android, O=Google, C=US"
          fi
          
          # Assign to app directory if exists
          if [ -d "app" ]; then
            cp my-upload-key.jks app/my-upload-key.jks || true
          fi
          
          # 2. Create dummy google-services.json if missing
          if [ -d "app" ] && [ ! -f "app/google-services.json" ]; then
            echo '{"project_info":{"project_number":"123456","project_id":"chandiox-social-app","storage_bucket":"://appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:123456:android:123456","android_client_info":{"package_name":"com.chandio.social"}},"api_key":[{"current_key":"mock_key_here"}]}]}' > app/google-services.json
          fi

      - name: Build AAB with Gradle
        run: |
          gradle bundleRelease -x lint --no-daemon --no-configuration-cache
          
          
          

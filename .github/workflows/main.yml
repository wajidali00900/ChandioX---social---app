name: Build AAB
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Fix missing Gradle Wrapper
        run: |
          if [ ! -f "./gradlew" ] && [ ! -f "./android/gradlew" ]; then
            echo "Gradle wrapper missing, creating it..."
            gradle wrapper --gradle-version 8.7
          fi
          chmod +x gradlew || true
          chmod +x android/gradlew || true
          ls -la
          ls -la android/ || true

      - name: Create Keystore
        run: |
          keytool -genkey -v -keystore my-upload-key.jks -keyalg RSA -keysize 2048 -validity 10000 -storepass android -alias upload -keypass android -dname "CN=ChandioX"
          mkdir -p app
          cp my-upload-key.jks app/my-upload-key.jks || true
          mkdir -p android/app
          cp my-upload-key.jks android/app/my-upload-key.jks || true

      - name: Build AAB
        run: |
          if [ -f "./android/gradlew" ]; then
            cd android && ./gradlew bundleRelease -x lint --no-daemon --no-configuration-cache
          elif [ -f "./gradlew" ]; then
            ./gradlew bundleRelease -x lint --no-daemon --no-configuration-cache
          else
            gradle bundleRelease -x lint --no-daemon --no-configuration-cache
          fi

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: ChandioX-AAB-FINAL
          path: |
            **/build/outputs/bundle/release/*.aab

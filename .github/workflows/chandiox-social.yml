name: Gift Head Workflow

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build-gift-head:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.22.0"
          channel: "stable"

      - name: Install Dependencies
        run: flutter pub get

      - name: Build APK
        run: |
          echo "Building Gift Head Module for ChandioX..."
          flutter build apk --debug --target=lib/features/gift_head/gift_head.dart

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gift-head-apk
          path: build/app/outputs/flutter-apk/app-debug.apk

  send-gift-logic:
    runs-on: ubuntu-latest
    needs: build-gift-head

    steps:
      - name: Run Gift Logic
        run: |
          echo "Gift Head Workflow Started"
          echo "User can send gift -> Deduct coins -> Show animation"
